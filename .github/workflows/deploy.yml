name: Deploy

# Deploys main to the EC2 host after CI passes on main. Can also be run by hand.
# No SSH: the job assumes an AWS role through OIDC, uploads a release tarball to
# S3 and asks the host to deploy it with Systems Manager Run Command. The host
# reads its own .env from SSM Parameter Store.
#
# Repository variables (Settings -> Secrets and variables -> Actions -> Variables),
# all from `terraform output`:
#   AWS_REGION            region the stack runs in
#   AWS_DEPLOY_ROLE_ARN   github_deploy_role_arn
#   DEPLOY_INSTANCE_ID    instance_id
#   DEPLOY_BUCKET         releases_bucket
#   SITE_ADDRESS          site_address (hostname, no scheme)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to production
    # For workflow_run, only deploy when CI actually passed.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Package and upload release
        run: |
          git archive --format=tar.gz -o release.tgz "$SHA"
          aws s3 cp release.tgz "s3://${{ vars.DEPLOY_BUCKET }}/releases/${SHA}.tgz"

      - name: Deploy through Systems Manager
        run: |
          cat > params.json <<JSON
          {"commands": [
            "set -euo pipefail",
            "export AWS_DEFAULT_REGION=${{ vars.AWS_REGION }}",
            "rm -rf /tmp/release && mkdir /tmp/release",
            "aws s3 cp s3://${{ vars.DEPLOY_BUCKET }}/releases/${SHA}.tgz /tmp/release.tgz",
            "tar -xzf /tmp/release.tgz -C /tmp/release",
            "bash /tmp/release/deploy/remote-deploy.sh /tmp/release"
          ]}
          JSON
          COMMAND_ID=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "${{ vars.DEPLOY_INSTANCE_ID }}" \
            --comment "deploy ${SHA}" \
            --timeout-seconds 1800 \
            --parameters file://params.json \
            --query Command.CommandId --output text)
          echo "command id: $COMMAND_ID"

          for _ in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
              --instance-id "${{ vars.DEPLOY_INSTANCE_ID }}" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done

          aws ssm get-command-invocation --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.DEPLOY_INSTANCE_ID }}" \
            --query '{status:Status,out:StandardOutputContent,err:StandardErrorContent}' --output text
          [ "$STATUS" = "Success" ]

      - name: Smoke test
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS "https://${{ vars.SITE_ADDRESS }}/health"; then
              echo; echo "healthy after ${attempt} attempt(s)"; exit 0
            fi
            sleep 10
          done
          echo "health check failed" >&2
          exit 1
